name: regression

on:
  schedule:
    - cron: '30 0 * * *'          # 06:00 IST — the run that trips the planted bug
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: Preview URL to test against
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium

      - name: Run acceptance subset
        env:
          # PR runs are restricted to smoke or regression. e2e sends SMS.
          SBX_MARKERS: smoke or regression
          SBX_BASE_URL: ${{ inputs.base_url || vars.SBX_BASE_URL }}
          SBX_DB_URL: ${{ secrets.SBX_DB_URL }}
        run: |
          test -n "$SBX_BASE_URL" || { echo "::error::SBX_BASE_URL is empty — refusing to run"; exit 1; }
          # No --tracing here: that flag comes from pytest-playwright, which this
          # repo deliberately does not use. conftest.py starts and stops tracing
          # itself, per test, and writes to traces/.
          uv run pytest -m "$SBX_MARKERS" --json-report --json-report-file=report.json

      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: traces, path: traces/, if-no-files-found: ignore }

      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: report, path: report.json, if-no-files-found: warn }

      - if: always()
        env:
          SBX_DB_URL: ${{ secrets.SBX_DB_URL }}
          SBX_BASE_URL: ${{ inputs.base_url || vars.SBX_BASE_URL }}
          # Without this the markers column lands empty, and Stage 6 cannot tell a
          # smoke-only run from a full acceptance run when comparing pass rates.
          SBX_MARKERS: smoke or regression
        run: uv run python report_to_db.py report.json

  triage:
    needs: test
    # Schedule is the honest version of this experiment — nobody present, nobody
    # looking. But waiting a full day to find out whether the chain works at all is
    # a slow way to debug a webhook, so a manual dispatch fires it too. The issue
    # body records which trigger it was, because "work arrived that no human filed"
    # is a weaker claim when a human pressed the button.
    if: >-
      failure() &&
      contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    # claude-code-action authenticates via GitHub OIDC and fails with
    # "Could not fetch an OIDC token" without this. The default token has no
    # id-token scope, so the omission is silent until the job actually runs.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: report, path: . }

      # Two ways to authenticate, and the rig should use whichever exists.
      # An API key is billed per token; an OAuth token from `claude setup-token`
      # draws on a Claude SUBSCRIPTION instead. That difference matters for the
      # eval suite: a runaway loop on a subscription does not cost money, it
      # consumes the rate limit a person is also trying to use.
      - id: capability
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "claude=true" >> "$GITHUB_OUTPUT"
          else
            echo "claude=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set \
            — falling back to deterministic triage. The issue will still be filed, \
            but without a diagnosis."
          fi

      - name: Claude triages the failure into Linear
        id: claude
        if: steps.capability.outputs.claude == 'true'
        # Do not let a triage failure end the job. If Claude cannot run, the
        # deterministic filer below must still get its turn — otherwise a broken
        # credential means NOTHING is filed, which looks exactly like "no bugs
        # found". That is the failure this run actually produced.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The scheduled acceptance suite failed. Read report.json and the traces.
            Deduplicate against open SBX bugs before filing anything.
            File or comment on a Linear bug with labels: bug, qa-regression.
            Then write an intent.md for it in sbx-sdlc so Stage 1 has an artifact.

      # No model in this path. The thesis of Stage 6 is that work ARRIVES without a
      # human filing it — that should not depend on a model being reachable.
      - name: Deterministic triage (no Claude, or Claude failed)
        if: steps.capability.outputs.claude != 'true' || steps.claude.outcome == 'failure'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          SBX_BASE_URL: ${{ inputs.base_url || vars.SBX_BASE_URL }}
          TRIGGER: ${{ github.event_name }}
        run: python3 file_regression_bug.py report.json

      # Cheap insurance, and it must not depend on which path ran. Ask Linear
      # directly: did an issue get created or touched in the last ten minutes?
      # Checking a local file only proved the deterministic path worked, and the
      # Claude path never writes one.
      - name: Assert an issue actually reached Linear
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
        run: python3 verify_triage.py
