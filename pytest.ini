[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
addopts = -ra --reruns 2 --reruns-delay 1

markers =
    smoke: fast happy-path checks, safe on every PR
    regression: broader behavioural checks, safe on every PR
    e2e: SENDS SMS. Never run on a PR. Blocked by sms-guard.sh without SBX_ALLOW_SMS=1
    ui: visual and layout assertions
